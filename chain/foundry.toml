[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["vendor"]
remappings = ["@openzeppelin/contracts/=vendor/openzeppelin/"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./fixtures" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
